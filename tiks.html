<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIK S</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #030712; color: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow-x: hidden; }

        /* Cyber Canvas Background */
        #networkCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #071126 0%, #030712 100%); }

        /* Header Logo */
        .app-header { text-align: center; padding: 35px 15px 10px; }
        .app-logo { width: 95px; height: 95px; border-radius: 50%; border: 2px solid #00f2fe; box-shadow: 0 0 20px rgba(0,242,254,0.6); object-fit: cover; }
        .app-title { font-size: 1.6rem; color: #00f2fe; letter-spacing: 2px; margin-top: 10px; font-weight: bold; }

        /* Downloader Card Container */
        .main-card { max-width: 400px; width: 90%; margin: 20px auto; background: rgba(11, 19, 43, 0.85); padding: 22px; border-radius: 16px; border: 1px solid rgba(0, 242, 254, 0.3); backdrop-filter: blur(10px); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .url-input { width: 100%; padding: 14px 15px; background: #0b132b; border: 1px solid #3a506b; border-radius: 10px; color: #fff; text-align: center; font-size: 0.95rem; outline: none; margin-bottom: 15px; transition: 0.3s; }
        .url-input:focus { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0,242,254,0.4); }

        .action-btn { width: 100%; padding: 13px; background: #00f2fe; color: #030712; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .action-btn:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }

        /* Quality Options Section */
        #qualitySection { display: none; margin-top: 20px; border-top: 1px dashed rgba(0,242,254,0.3); padding-top: 15px; }
        .quality-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 15px; background: rgba(0, 242, 254, 0.1); border: 1px solid #00f2fe; border-radius: 10px; color: #fff; text-decoration: none; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; transition: 0.3s; }
        .quality-btn:hover { background: #00f2fe; color: #030712; }

        /* CONNECT Social Icons Only */
        .connect-container { text-align: center; padding: 20px 15px 40px; }
        .social-box { display: inline-flex; justify-content: center; gap: 25px; background: rgba(11, 19, 43, 0.85); padding: 12px 30px; border-radius: 50px; border: 1px solid rgba(0, 242, 254, 0.3); backdrop-filter: blur(8px); }
        .social-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; text-decoration: none; border: 2px solid; transition: 0.3s ease; }
        .social-icon.fb { border-color: #1877f2; color: #1877f2; box-shadow: 0 0 12px rgba(24, 119, 242, 0.6); }
        .social-icon.tt { border-color: #00f2fe; color: #00f2fe; box-shadow: 0 0 12px rgba(0, 242, 254, 0.6); }
        .social-icon:hover { transform: scale(1.15); }
    </style>
</head>
<body>

    <canvas id="networkCanvas"></canvas>

    <!-- App Header & 3D Logo -->
    <div class="app-header">
        <img src="https://i.ibb.co/LzYrX2k/1000015934.png" class="app-logo" alt="TIK S Logo">
        <div class="app-title">TIK S</div>
    </div>

    <!-- Main Downloader Card -->
    <div class="main-card">
        <input type="text" id="videoLink" class="url-input" placeholder="Paste TikTok or Facebook link here...">
        <button id="downloadBtn" class="action-btn" onclick="startProcess()">Download Now</button>

        <!-- Dynamic Quality Download Options -->
        <div id="qualitySection">
            <a id="hdLink" href="#" download target="_blank" class="quality-btn">
                <span>1. Download High Quality (HD)</span>
                <i class="fas fa-download"></i>
            </a>
            <a id="sdLink" href="#" download target="_blank" class="quality-btn">
                <span>2. Download Normal Quality (SD)</span>
                <i class="fas fa-download"></i>
            </a>
        </div>
    </div>

    <!-- Bottom Profile Links (Facebook & TikTok Only) -->
    <div class="connect-container">
        <div class="social-box">
            <a href="https://www.facebook.com/your.xakib.vai" target="_blank" class="social-icon fb" title="Facebook Profile"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.tiktok.com/@2f_gaming" target="_blank" class="social-icon tt" title="TikTok Profile"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>

    <script>
        // Cyber Canvas Animation Logic
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        let nodes = [], pulses = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initNodes(); }
        function initNodes() {
            nodes = [];
            const count = Math.floor((canvas.width * canvas.height) / 18000);
            for (let i = 0; i < count; i++) {
                nodes.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8, radius: Math.random() * 2 + 1.5 });
            }
        }
        function drawNetwork() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            nodes.forEach(node => {
                node.x += node.vx; node.y += node.vy;
                if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
                if (node.y < 0 || node.y > canvas.height) node.vy *= -1;
                ctx.beginPath(); ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00f2fe'; ctx.shadowBlur = 8; ctx.shadowColor = '#00f2fe'; ctx.fill();
            });
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 130) {
                        ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = `rgba(0, 242, 254, ${1 - dist / 130 * 0.85})`; ctx.lineWidth = 0.6; ctx.stroke();
                        if (Math.random() < 0.0012) pulses.push({ x1: nodes[i].x, y1: nodes[i].y, x2: nodes[j].x, y2: nodes[j].y, progress: 0 });
                    }
                }
            }
            for (let p = pulses.length - 1; p >= 0; p--) {
                let pulse = pulses[p]; pulse.progress += 0.04;
                if (pulse.progress >= 1) { pulses.splice(p, 1); continue; }
                const px = pulse.x1 + (pulse.x2 - pulse.x1) * pulse.progress, py = pulse.y1 + (pulse.y2 - pulse.y1) * pulse.progress;
                ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 12; ctx.shadowColor = '#00f2fe'; ctx.fill();
            }
            requestAnimationFrame(drawNetwork);
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas(); drawNetwork();

        // Downloader API Logic
        async function startProcess() {
            const linkInput = document.getElementById('videoLink').value.trim();
            const btn = document.getElementById('downloadBtn');
            const qualitySec = document.getElementById('qualitySection');

            if (!linkInput) { alert("Please paste a valid video link first!"); return; }

            btn.disabled = true;
            qualitySec.style.display = "none";
            let timeLeft = 5;

            let directHdUrl = "", directSdUrl = "";
            
            try {
                const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(linkInput)}`;
                const response = await fetch(apiUrl);
                const result = await response.json();

                if (result.data) {
                    directHdUrl = result.data.play; 
                    directSdUrl = result.data.wmplay || result.data.music; 
                } else {
                    directHdUrl = linkInput;
                    directSdUrl = linkInput;
                }
            } catch (err) {
                directHdUrl = linkInput;
                directSdUrl = linkInput;
            }

            const timer = setInterval(() => {
                btn.innerText = `Please wait ${timeLeft} seconds...`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(timer);
                    btn.innerText = "Download Now";
                    btn.disabled = false;
                    
                    document.getElementById('hdLink').href = directHdUrl || "#"; 
                    document.getElementById('sdLink').href = directSdUrl || "#"; 

                    qualitySec.style.display = "block";
                }
            }, 1000);
        }
    </script>
</body>
</html>
